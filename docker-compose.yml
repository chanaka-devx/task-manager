services:
  frontend:
    image: chanakamadhuranga/task-manager:latest
    container_name: taskmanager-frontend
    ports:
      - '5173:80'
    environment:
      - VITE_API_BASE_URL=http://129.212.232.43:4000
    depends_on:
      - backend
    restart: unless-stopped
      
  backend:
    image: chanakamadhuranga/task-manager-server:latest
    container_name: taskmanager-backend
    ports:
      - '4000:4000'
    environment:
      - PORT=4000
      - MONGODB_URI=mongodb://taskmanager-mongo:27017/taskmanager
      - JWT_SECRET=2e4a69a43c44c83194e29f5e4481364a8960294e3c3e90cb048188ca850f9c18
    depends_on:
      - taskmanager-mongo
    restart: unless-stopped
      
  mongo:
    image: mongo:6
    container_name: taskmanager-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
  
  prometheus:
    image: prom/prometheus:latest
    container_name: taskmanager-prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - backend
    restart: unless-stopped
  
  grafana:
    image: grafana/grafana:latest
    container_name: taskmanager-grafana
    ports:
      - '3000:3000'
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: unless-stopped
      
volumes:
  mongo_data:
  prometheus_data:
  grafana_data:
